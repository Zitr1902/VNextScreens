plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven { url = 'https://jitpack.io' }
	mavenCentral()
}

// Разбор ссылок YouTube прямо у игрока (та же сборка NewPipeExtractor, что у Dream Displays)
def newpipe = '8584a0d636ce6b8371d2c5c83dbe7f01a3d21d59'

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// всё вкладывается внутрь мода (jar-in-jar)
	include(implementation("com.github.TeamNewPipe:NewPipeExtractor:${newpipe}") { transitive = false })
	include(implementation("com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"))
	include(implementation("org.jsoup:jsoup:1.23.1"))
	include(implementation("com.google.protobuf:protobuf-javalite:4.36.1"))
	include(implementation("org.mozilla:rhino:1.8.1"))
	include(implementation("org.mozilla:rhino-engine:1.8.1"))
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
